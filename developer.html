<!DOCTYPE html>

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

      <section class="panel compact-panel"><h2>熱門空間</h2><div id="popular-spaces" class="analytics-list"></div></section>

  <script src="./config.js"></script>
